version: '3.8'

services:
  app:
    build: .
    container_name: despensa-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CATALOGO_DB_DIR=/app/backend
    volumes:
      - ./data:/app/backend
      - ./backups:/app/backend/backups
