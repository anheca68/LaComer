version: '3.8'

services:
  app:
    build: .
    container_name: despensa-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
