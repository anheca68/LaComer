{% extends "base.html" %}

{% block titulo %}Administración - Login{% endblock %}

{% block extra_styles %}
<link rel="stylesheet" href="/static/css/admin.css">
{% endblock %}

{% block contenido %}
<div class="login-container">
    <div class="login-box">
        <h1>Panel de Administración</h1>
        <p class="muted">Ingresa la contraseña para continuar</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/admin/login" class="form-login">
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="input-admin" autofocus>
            </div>
            <button type="submit" class="btn-admin btn-block">Entrar</button>
        </form>

        <a href="/" class="link-volver">← Volver al panel</a>
    </div>
</div>
{% endblock %}
