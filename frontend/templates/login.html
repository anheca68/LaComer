{% extends "base.html" %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block extra_styles %}
<link rel="stylesheet" href="/static/css/admin.css">
{% endblock %}

{% block contenido %}
<div class="login-container">
    <div class="login-box">
        <h1>Gestor de Tickets</h1>
        <p class="muted">Inicia sesión para continuar</p>

        <form method="post" action="/login" class="form-login">
            <input type="hidden" name="siguiente" value="{{ siguiente }}">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required
                       class="input-admin" autocomplete="username"
                       value="{{ usuario_escrito or '' }}" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="input-admin" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-admin btn-block">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
